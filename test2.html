<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KTR ERP Premium Loader</title>
        <style>
            /* Base Styling & Background */
            body {
                /* background-color: #0a0818; */
                background-color: #0a0818;

                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: "Arial", sans-serif;
                overflow: hidden;
            }

            /* Container to keep everything centered */
            .loader-container {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Top Text Styling */
            .ktr-title {
                color: #d1d1f0; /* Silver-ish purple text color */
                font-size: 3rem;
                font-weight: bold;
                letter-spacing: 5px;
                text-transform: uppercase;
                margin-bottom: 5px;
                text-shadow: 0 0 15px rgba(209, 209, 240, 0.6);
            }

            .ktr-tagline {
                color: #a2a2c7;
                font-size: 1rem;
                letter-spacing: 2px;
                margin-bottom: 50px;
            }

            /* Central Logo Setup (Recreated with CSS) */
            .logo-wrapper {
                position: relative;
                width: 180px;
                height: 180px;
                margin-bottom: 60px;
            }

            /* The central glowing halo ring */
            .halo-ring {
                position: absolute;
                top: 10%;
                left: 10%;
                width: 80%;
                height: 80%;
                border: 4px solid #7146ce; /* Halo color */
                border-radius: 50%;
                box-shadow: 0 0 40px #7146ce;
                animation: pulseHalo 2s infinite ease-in-out;
            }

            /* The looping 3D figure (Abstracted with CSS) */
            .loop-figure {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 15px solid #4a2893; /* Glossy purple color */
                border-bottom: 15px solid transparent;
                border-radius: 50%;
                transform: rotate(-30deg);
                box-shadow:
                    0 0 15px rgba(0, 0, 0, 0.3),
                    inset 0 0 20px #8e61e6,
                    /* Highlight */ 0 0 30px #7146ce; /* Core Glow */
                animation: spinLoop 5s linear infinite;
            }

            /* Connecting threads (Simulated) */
            .loop-figure::before,
            .loop-figure::after {
                content: "";
                position: absolute;
                border: 2px solid #a2a2c7;
                border-radius: 50%;
                opacity: 0.5;
            }

            .loop-figure::before {
                top: 20%;
                left: 20%;
                width: 60%;
                height: 60%;
                border-top: 2px solid transparent;
            }

            .loop-figure::after {
                top: 30%;
                left: 30%;
                width: 40%;
                height: 40%;
                border-right: 2px solid transparent;
            }

            /* Bottom small halo ring */
            .bottom-halo {
                position: absolute;
                bottom: -35px;
                left: 50%;
                transform: translateX(-50%);
                width: 40px;
                height: 40px;
                border: 3px solid #7146ce;
                border-radius: 50%;
                box-shadow: 0 0 20px #7146ce;
                animation: pulseHalo 2s infinite ease-in-out;
            }

            /* Progress Bar Styling (Glowing dots) */
            .progress-bar {
                display: flex;
                justify-content: center;
                gap: 15px;
                margin-bottom: 60px;
            }

            .dot {
                width: 12px;
                height: 12px;
                background-color: #d1d1f0;
                border-radius: 50%;
                box-shadow: 0 0 10px #d1d1f0;
                animation: dotFade 1.4s infinite ease-in-out;
            }

            /* Staggered animation for dots */
            .dot:nth-child(1) {
                animation-delay: 0s;
            }
            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }
            .dot:nth-child(4) {
                animation-delay: 0.6s;
            }
            .dot:nth-child(5) {
                animation-delay: 0.8s;
            }
            .dot:nth-child(6) {
                animation-delay: 1s;
            }
            .dot:nth-child(7) {
                animation-delay: 1.2s;
            }

            /* The JS Code Box (Bottom-Left) */
            .js-code-box {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background-color: rgba(255, 255, 255, 0.05);
                color: #a2a2c7;
                padding: 10px 15px;
                font-family: "Courier New", monospace;
                font-size: 0.9rem;
                border: 1px solid rgba(209, 209, 240, 0.2);
                border-radius: 5px;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            }

            /* Animations */
            @keyframes spinLoop {
                0% {
                    transform: rotate(-30deg);
                }
                100% {
                    transform: rotate(330deg);
                }
            }

            @keyframes pulseHalo {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                    box-shadow: 0 0 40px #7146ce;
                }
                50% {
                    transform: scale(1.05);
                    opacity: 0.8;
                    box-shadow: 0 0 60px #7146ce;
                }
            }

            @keyframes dotFade {
                0%,
                100% {
                    opacity: 0.3;
                    transform: scale(0.8);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        </style>

            /**
             * KTR ERP Loader Global Toggle Function
             */
            function KTR_ERP_API_LOADER(show) {
                const overlay = document.getElementById(
                    "ktr-erp-loader-overlay",
                );
                if (!overlay) return;

                if (show) {
                    overlay.classList.remove("ktr-hide");
                } else {
                    overlay.classList.add("ktr-hide");
                }
            }

            // 🔥 PREMIUM INTERNET CHECK FUNCTION (Actual Ping Test)
            async function checkActualInternet() {
                // Pehle basic check (agar device hi disconnected hai to aage check karne ki zaroorat nahi)
                if (!navigator.onLine) {
                    KTR_ERP_API_LOADER(true);
                    return;
                }

                try {
                    // Hum Microsoft ya kisi public reliable server par ek choti si request bhej kar check karenge
                    // cache: "no-store" lagaya hai taaki har baar naya check ho
                    const response = await fetch(
                        "https://www.msftconnecttest.com/connecttest.txt",
                        {
                            method: "HEAD",
                            mode: "no-cors",
                            cache: "no-store",
                        },
                    );

                    // Agar request successfully chali gayi, matlab internet chal raha hai
                    KTR_ERP_API_LOADER(false);
                } catch (error) {
                    // Agar request fail hui (matlab Wi-Fi connected hai par internet nahi chal raha)
                    KTR_ERP_API_LOADER(true);
                }
            }

            // 1. Monitor Network Changes (Jaise hi Wi-Fi connect/disconnect ho)
            window.addEventListener("online", checkActualInternet);
            window.addEventListener("offline", () => KTR_ERP_API_LOADER(true));

            // 2. Har 5-10 second mein background mein check karne ke liye (Optional par ERP ke liye best hai)
            setInterval(checkActualInternet, 10000); // Har 10 second mein check karega

            // 3. Initial Page Boot Setup (Software khulne par)
            document.addEventListener("DOMContentLoaded", () => {
                // Khulne par pehle check karega
                checkActualInternet();

                // Agar sab sahi raha to 3 second baad loader automatic band ho jayega (jo aapne lagaya tha)
                setTimeout(() => {
                    if (navigator.onLine) {
                        checkActualInternet(); // Ek final check band karne se pehle
                    }
                }, 3000);
            });
