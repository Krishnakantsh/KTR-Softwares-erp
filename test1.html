<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KTR ERP Premium Loader</title>
        <style>
            /* Base Styling & Background */
            body {
                background-color: #100c28;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: "Arial", sans-serif;
                overflow: hidden;
            }

            /* Main Full Screen Overlay Layer */
            #ktr-erp-loader-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #100c28; /* No background bands or light horizontal stripes */
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 99999;
                opacity: 1;
                visibility: visible;
                transition: opacity 0.4s ease, visibility 0.4s ease;
            }

            /* CSS class controlled smoothly via JavaScript */
            #ktr-erp-loader-overlay.ktr-hide {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            /* Container to keep everything centered */
            .loader-container {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Top Text Styling */
            .ktr-title {
                color: #d1d1f0; /* Silver-ish purple text color */
                font-size: 3rem;
                font-weight: bold;
                letter-spacing: 5px;
                text-transform: uppercase;
                margin-bottom: 5px;
                text-shadow: 0 0 15px rgba(209, 209, 240, 0.6);
            }

            .ktr-tagline {
                color: #a2a2c7;
                font-size: 1rem;
                letter-spacing: 2px;
                margin-bottom: 50px;
            }

            /* Central Logo Setup */
            .logo-wrapper {
                position: relative;
                width: 180px;
                height: 180px;
                margin-bottom: 60px;
            }

            /* The central glowing halo ring */
            .halo-ring {
                position: absolute;
                top: 10%;
                left: 10%;
                width: 80%;
                height: 80%;
                border: 4px solid #7146ce; /* Halo color */
                border-radius: 50%;
                box-shadow: 0 0 40px #7146ce;
                animation: pulseHalo 2s infinite ease-in-out;
            }

            /* The looping 3D figure */
            .loop-figure {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 15px solid #4a2893; /* Glossy purple color */
                border-bottom: 15px solid transparent;
                border-radius: 50%;
                transform: rotate(-30deg);
                box-shadow:
                    0 0 15px rgba(0, 0, 0, 0.3),
                    inset 0 0 20px #8e61e6,
                    0 0 30px #7146ce; /* Core Glow */
                animation: spinLoop 5s linear infinite;
            }

            /* Connecting threads */
            .loop-figure::before,
            .loop-figure::after {
                content: "";
                position: absolute;
                border: 2px solid #a2a2c7;
                border-radius: 50%;
                opacity: 0.5;
            }

            .loop-figure::before {
                top: 20%;
                left: 20%;
                width: 60%;
                height: 60%;
                border-top: 2px solid transparent;
            }

            .loop-figure::after {
                top: 30%;
                left: 30%;
                width: 40%;
                height: 40%;
                border-right: 2px solid transparent;
            }

            /* Bottom small halo ring */
            .bottom-halo {
                position: absolute;
                bottom: -35px;
                left: 50%;
                transform: translateX(-50%);
                width: 40px;
                height: 40px;
                border: 3px solid #7146ce;
                border-radius: 50%;
                box-shadow: 0 0 20px #7146ce;
                animation: pulseHalo 2s infinite ease-in-out;
            }

            /* Progress Bar Styling (7 Clean Matrix Dots) */
            .progress-bar {
                display: flex;
                justify-content: center;
                gap: 15px;
            }

            .dot {
                width: 12px;
                height: 12px;
                background-color: #d1d1f0;
                border-radius: 50%;
                box-shadow: 0 0 10px #d1d1f0;
                animation: dotFade 1.4s infinite ease-in-out;
            }

            /* Staggered animation for dots */
            .dot:nth-child(1) { animation-delay: 0s; }
            .dot:nth-child(2) { animation-delay: 0.2s; }
            .dot:nth-child(3) { animation-delay: 0.4s; }
            .dot:nth-child(4) { animation-delay: 0.6s; }
            .dot:nth-child(5) { animation-delay: 0.8s; }
            .dot:nth-child(6) { animation-delay: 1s; }
            .dot:nth-child(7) { animation-delay: 1.2s; }

            /* Animations Keyframes */
            @keyframes spinLoop {
                0% { transform: rotate(-30deg); }
                100% { transform: rotate(330deg); }
            }

            @keyframes pulseHalo {
                0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 40px #7146ce; }
                50% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 60px #7146ce; }
            }

            @keyframes dotFade {
                0%, 100% { opacity: 0.3; transform: scale(0.8); }
                50% { opacity: 1; transform: scale(1); }
            }
        </style>
    </head>
    <body>

        <div id="ktr-erp-loader-overlay">
            <div class="loader-container">
                <div class="ktr-title">KTR ERP</div>
                <div class="ktr-tagline">CONNECTING YOUR WORLD...</div>

                <div class="logo-wrapper">
                    <div class="halo-ring"></div>
                    <div class="loop-figure"></div>
                    <div class="bottom-halo"></div>
                </div>

                <div class="progress-bar">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <script>
            /**
             * KTR ERP Loader Global Toggle Function
             * @param {boolean} show - 'true' to show loader, 'false' to hide it.
             */
            function KTR_ERP_API_LOADER(show) {
                const overlay = document.getElementById("ktr-erp-loader-overlay");
                if (!overlay) return;

                if (show) {
                    overlay.classList.remove("ktr-hide");
                } else {
                    overlay.classList.add("ktr-hide");
                }
            }

            // --- Automations (Internet status and Initial Boot) ---

            // 1. Monitor Internet Connection
            function handleNetworkChange() {
                if (!navigator.onLine) {
                    KTR_ERP_API_LOADER(true); // Internet connection down -> Loader lock screen
                }
            }
            window.addEventListener("online", handleNetworkChange);
            window.addEventListener("offline", handleNetworkChange);

            // 2. Initial Page Boot Setup (Hide loader after 3 seconds if online)
            document.addEventListener("DOMContentLoaded", () => {
                if (!navigator.onLine) {
                    KTR_ERP_API_LOADER(true);
                } else {
                    setTimeout(() => {
                        KTR_ERP_API_LOADER(false); // Smooth premium fade out
                    }, 3000);
                }
            });
        </script>
    </body>
</html>
