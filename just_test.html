<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTR ERP Premium Loader</title>
    <style>
        /* Premium Background & Centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0914;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Full Screen Loader Container */
        #ktr-erp-loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #1a153a 0%, #07050d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* Hide class for JS control */
        #ktr-erp-loader-overlay.ktr-hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Responsive Wrapper */
        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Branding Text Styling */
        .brand-title {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(110, 68, 255, 0.6);
            animation: pulseText 2s infinite ease-in-out;
        }

        .brand-subtitle {
            color: #a29bfe;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* Premium CSS Logo Container */
        .logo-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 40px;
        }

        /* Outer Premium Glow Ring */
        .glow-ring {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border: 2px solid rgba(110, 68, 255, 0.1);
            border-top: 2px solid rgba(162, 155, 254, 0.8);
            border-radius: 50%;
            animation: spinRing 3s linear infinite;
        }

        /* The Triskelion/3-Human Logo Shape recreated via CSS */
        .ktr-logo-graphics {
            position: relative;
            width: 100%;
            height: 100%;
            animation: modernSpin 4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        /* Custom Vector-feel shapes using CSS to mimic the uploaded logo */
        .human-node {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .human-node::before {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: #6e44ff;
            border-radius: 50%;
            box-shadow: 0 0 25px #6e44ff;
        }

        .human-node::after {
            content: '';
            position: absolute;
            border: 12px solid transparent;
            border-top: 12px solid #5a32e6;
            border-left: 12px solid #5a32e6;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
        }

        /* Positioning the 3 interactive nodes in a tri-spiral formation */
        .node-1 { transform: rotate(0deg); }
        .node-1::before { top: 10px; left: 60px; }
        .node-1::after { width: 90px; height: 90px; top: 25px; left: 35px; }

        .node-2 { transform: rotate(120deg); }
        .node-2::before { top: 10px; left: 60px; }
        .node-2::after { width: 90px; height: 90px; top: 25px; left: 35px; }

        .node-3 { transform: rotate(240deg); }
        .node-3::before { top: 10px; left: 60px; }
        .node-3::after { width: 90px; height: 90px; top: 25px; left: 35px; }

        /* Modern Progress Dots (Dots matrix loader at bottom) */
        .dots-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #6e44ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #6e44ff;
            animation: dotFlashing 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        .dot:nth-child(4) { animation-delay: 0.6s; }
        .dot:nth-child(5) { animation-delay: 0.8s; }

        /* Premium Animations Keyframes */
        @keyframes modernSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRing {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes dotFlashing {
            0%, 100% { background-color: rgba(110, 68, 255, 0.2); box-shadow: none; }
            50% { background-color: #a29bfe; box-shadow: 0 0 15px #a29bfe; }
        }

        /* Responsive Adjustments for Mobile Screens */
        @media (max-width: 480px) {
            .brand-title { font-size: 1.9rem; }
            .brand-subtitle { font-size: 0.75rem; }
            .logo-container { width: 130px; height: 130px; }
            .glow-ring { top: -15px; left: -15px; right: -15px; bottom: -15px; }
            .human-node::before { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <div id="ktr-erp-loader-overlay">
        <div class="loader-wrapper">
            <h1 class="brand-title">KTR ERP</h1>
            <p class="brand-subtitle">Connecting Your World</p>
            
            <div class="logo-container">
                <div class="glow-ring"></div>
                <div class="ktr-logo-graphics">
                    <div class="human-node node-1"></div>
                    <div class="human-node node-2"></div>
                    <div class="human-node node-3"></div>
                </div>
            </div>

            <div class="dots-loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <script>
        /**
         * KTR ERP Loader Controller Function
         * @param {boolean} show - True to show loader, False to hide it.
         */
        function KTR_ERP_API_LOADER(show) {
            const loaderOverlay = document.getElementById('ktr-erp-loader-overlay');
            if (!loaderOverlay) return;

            if (show) {
                loaderOverlay.classList.remove('ktr-hide');
            } else {
                loaderOverlay.classList.add('ktr-hide');
            }
        }

        // --- Automations according to your requirements ---

        // 1. Internet Connection Monitor (Offline hone par automatic screen par block karega)
        function checkInternetStatus() {
            if (!navigator.onLine) {
                KTR_ERP_API_LOADER(true); // Internet nahi hai, loader dikhao
            } else {
                // Agar koi active API call nahi chal rahi to band karo (Demo purpose)
                // KTR_ERP_API_LOADER(false); 
            }
        }

        window.addEventListener('online', checkInternetStatus);
        window.addEventListener('offline', checkInternetStatus);

        // 2. Software Open/Initial Load Animation (Software khulte hi 3.5 seconds tak dikhega)
        document.addEventListener("DOMContentLoaded", () => {
            // Pehle check karega internet hai ya nahi
            if (!navigator.onLine) {
                KTR_ERP_API_LOADER(true);
            } else {
                // Khulte hi loader active rahega, fir 3.5s baad smooth fade-out hoga
                setTimeout(() => {
                    KTR_ERP_API_LOADER(false);
                }, 10000);
            }
        });

        /* 3. API Call Integration Example (Tum aise use kar sakte ho apne code me):
           
           function fetchErpData() {
               KTR_ERP_API_LOADER(true); // API Request shuru, loader ON
               
               fetch('https://api.ktr-erp.com/data')
                   .then(response => response.json())
                   .then(data => {
                       // Handle data...
                   })
                   .finally(() => {
                       KTR_ERP_API_LOADER(false); // API complete, loader OFF
                   });
           }
        */
    </script>
</body>
</html>
